<section class="mt-5 mx-auto py-5">
  <div class="container py-4">
    <div class="row gy-4 gx-5 align-items-start">
      <div class="col-lg-8 col-md-12">
        <div
          class="video-wrapper rounded shadow-sm border border-3 border-info"
        >
          <div class="ratio ratio-16x9 rounded overflow-hidden">
            <iframe
              [src]="sanitizedVideoUrl"
              title="فيديو تعليمي"
              frameborder="0"
              allowfullscreen
              class="rounded"
            >
            </iframe>
          </div>
        </div>
      </div>

      <div class="col-lg-4 col-md-12">
        <div
          class="playlist-container p-3 rounded shadow-sm border border-2 border-warning bg-light"
        >
          <h4 class="text-center text-success fw-bold mb-3">Course Content</h4>

          <div
            class="list-group rounded-3"
            style="max-height: 70vh; overflow-y: auto"
          >
            @for (video of videos; track video) {
            <button
              (click)="selectVideo(video)"
              class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-3 px-3"
              [class.active]="video.embedUrl === selectedVideoUrl"
            >
              <img
                src="./images/clipart2941519.png"
                width="24"
                height="24"
                alt="play"
              />
              <span class="fw-semibold">{{ video.title }}</span>
            </button>
            }
          </div>
        </div>
      </div>
    </div>

    <section
      class="quiz-section mt-5 py-5 px-3 text-center text-white position-relative overflow-hidden rounded-4"
    >
      <div class="container position-relative z-1">
        <h2 class="fw-bold mb-3 display-5">Ready for a Fun Quiz?</h2>
        <p class="fs-5 mb-4">
          Test what you learned in the video with a colorful quiz adventure!
        </p>

        <button
          class="btn btn-lg btn-light text-warning fw-bold px-4 py-3 rounded-pill shadow bounce"
          [routerLink]="['/codeBase-quizes']"
        >
          <img
            src="./images/options_6194122.png"
            width="24"
            class="me-2"
            alt="quiz"
          />
          Let's Go!
        </button>
      </div>

      <img src="./images/boy.png" alt="Kid Cartoon" class="kid-image" />
    </section>
  </div>
</section>
